name: Refresh citation index

# Builds/refreshes the static hadith/tafsir index and the coverage report from
# live shamela.ws, then opens a PR with the result. Manual + monthly.
#
# The Worker does NOT depend on this: get_hadith_by_number falls back to
# shamela's live /ajax/specialnumber2id lookup when the static index is empty.
# The index only makes lookups cheaper (one page fetch instead of two requests).
#
# Be polite to shamela.ws: default delay 400 ms, one book per run by default.

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Hadith book_id to index (blank = Bukhari 1681)"
        default: "1681"
        required: false
      from:
        description: "First hadith number"
        default: "1"
        required: false
      to:
        description: "Last hadith number (blank = edition's last_number)"
        default: ""
        required: false
      step:
        description: "Sample every Nth number (1 = full)"
        default: "1"
        required: false
      tafsir:
        description: "Tafsir book_id to index (blank = skip)"
        default: ""
        required: false
      tafsir_from:
        description: "First tafsir page in this bounded slice"
        default: "1"
        required: false
      tafsir_to:
        description: "Last tafsir page in this bounded slice"
        default: "1000"
        required: false
  schedule:
    - cron: "17 3 1 * *" # monthly

concurrency:
  group: refresh-index
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Live citation and markup canaries
        run: npm run test:live

      - name: Verify canonical whitelist against live shamela.ws
        run: node scripts/resolve-canonical-editions.mjs

      - name: Coverage report (subcontinental works)
        run: node scripts/check-coverage.mjs

      - name: Build hadith index
        if: ${{ github.event_name == 'schedule' || inputs.book != '' }}
        env:
          BOOK: ${{ inputs.book || '1681' }}
          FROM: ${{ inputs.from || '1' }}
          TO: ${{ inputs.to }}
          STEP: ${{ inputs.step || '1' }}
        run: |
          set -euo pipefail
          args=(--book "$BOOK" "--from=$FROM" "--step=$STEP" --delay=400 --max-lookups=10000 --timeout=20000 --checkpoint=.hadith-index.checkpoint.json --resume)
          if [ -n "$TO" ]; then args+=("--to=$TO"); fi
          node scripts/build-hadith-index.mjs "${args[@]}"

      - name: Build bounded tafsir index slice
        if: ${{ inputs.tafsir != '' }}
        env:
          TAFSIR: ${{ inputs.tafsir }}
          TAFSIR_FROM: ${{ inputs.tafsir_from || '1' }}
          TAFSIR_TO: ${{ inputs.tafsir_to || '1000' }}
        run: node scripts/build-tafsir-index.mjs --tafsir "$TAFSIR" --from="$TAFSIR_FROM" --to="$TAFSIR_TO" --max-pages=1000 --timeout=20000 --checkpoint=.tafsir-index.checkpoint.json --resume --delay=400

      - name: Preserve resumable checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: citation-index-checkpoints
          if-no-files-found: ignore
          path: |
            .hadith-index.checkpoint.json
            .tafsir-index.checkpoint.json

      - name: Health gate after generated data changes
        run: npm run verify

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: bot/refresh-index
          title: "chore: refresh citation index & coverage report"
          commit-message: "chore: refresh citation index & coverage report"
          body: |
            Automated by `.github/workflows/refresh-index.yml`.
            - `src/data/hadith-index.mjs` (merged, never truncated)
            - `src/data/tafsir-index.mjs` (surah ranges + ayah → page; merged)
            - `reports/coverage.*`
            Review the run log for "unverified" counts before merging.
          add-paths: |
            src/data/hadith-index.mjs
            src/data/tafsir-index.mjs
            reports/
