name: Refresh citation index

# Builds/refreshes the static hadith/tafsir citation index from live
# shamela.ws, validates it offline, then opens a PR with the result.
# Manual + monthly.
#
# The Worker does NOT depend on this: get_hadith_by_number falls back to
# shamela's live /ajax/specialnumber2id lookup when the static index is empty.
# The index only makes lookups cheaper (one page fetch instead of two requests).
#
# Be polite to shamela.ws: default delay 400 ms, one book per run by default.

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Hadith book_id to index (blank = Bukhari 1681)"
        default: "1681"
        required: false
      from:
        description: "First hadith number (blank = next uncovered number)"
        default: ""
        required: false
      to:
        description: "Last hadith number (blank = bounded chunk from --from)"
        default: ""
        required: false
      chunk_size:
        description: "Maximum hadith lookups in this run (1-1000)"
        default: "100"
        required: false
      step:
        description: "Sample every Nth number (1 = full)"
        default: "1"
        required: false
      tafsir:
        description: "Tafsir book_id to index (blank = skip)"
        default: ""
        required: false
      tafsir_from:
        description: "First tafsir page in this bounded slice"
        default: "1"
        required: false
      tafsir_to:
        description: "Last tafsir page in this bounded slice"
        default: "1000"
        required: false
  schedule:
    - cron: "17 3 1 * *" # monthly

concurrency:
  group: refresh-index
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Offline quality gate
        run: npm run verify

      # Keep this job's live request budget for the selected slice. Broad live
      # canaries remain available through `npm run test:live` and
      # `npm run resolve:canonical`, but must not run before an index build.
      - name: Validate and compute bounded range
        id: range
        env:
          BOOK: ${{ inputs.book || '1681' }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          CHUNK_SIZE: ${{ inputs.chunk_size || '100' }}
          STEP: ${{ inputs.step || '1' }}
          TAFSIR: ${{ inputs.tafsir }}
          TAFSIR_FROM: ${{ inputs.tafsir_from || '1' }}
          TAFSIR_TO: ${{ inputs.tafsir_to || '1000' }}
        run: node scripts/plan-index-slice.mjs >> "$GITHUB_OUTPUT"

      - name: Restore compatible hadith checkpoint
        id: restore-hadith
        if: ${{ steps.range.outputs.complete != 'true' }}
        uses: actions/cache/restore@v5.0.3
        with:
          path: .hadith-index.checkpoint.json
          key: citation-index-${{ steps.range.outputs.hadith_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citation-index-${{ steps.range.outputs.hadith_scope }}-

      - name: Restore compatible tafsir checkpoint
        id: restore-tafsir
        if: ${{ inputs.tafsir != '' }}
        uses: actions/cache/restore@v5.0.3
        with:
          path: .tafsir-index.checkpoint.json
          key: citation-index-${{ steps.range.outputs.tafsir_scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            citation-index-${{ steps.range.outputs.tafsir_scope }}-

      - name: Build bounded hadith index slice
        id: build-hadith
        if: ${{ steps.range.outputs.complete != 'true' }}
        env:
          BOOK: ${{ steps.range.outputs.book }}
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
          STEP: ${{ steps.range.outputs.step }}
          MAX_LOOKUPS: ${{ steps.range.outputs.lookups }}
        run: node scripts/build-hadith-index.mjs --book "$BOOK" --from="$FROM" --to="$TO" --step="$STEP" --delay=400 --max-lookups="$MAX_LOOKUPS" --timeout=20000 --checkpoint=.hadith-index.checkpoint.json --resume

      - name: Build bounded tafsir index slice
        if: ${{ inputs.tafsir != '' }}
        env:
          TAFSIR: ${{ inputs.tafsir }}
          TAFSIR_FROM: ${{ inputs.tafsir_from || '1' }}
          TAFSIR_TO: ${{ inputs.tafsir_to || '1000' }}
        run: node scripts/build-tafsir-index.mjs --tafsir "$TAFSIR" --from="$TAFSIR_FROM" --to="$TAFSIR_TO" --max-pages=1000 --timeout=20000 --checkpoint=.tafsir-index.checkpoint.json --resume --delay=400

      - name: Preserve resumable hadith checkpoint
        if: ${{ always() && steps.range.outputs.complete != 'true' && hashFiles('.hadith-index.checkpoint.json') != '' }}
        uses: actions/cache/save@v5.0.3
        with:
          path: .hadith-index.checkpoint.json
          key: citation-index-${{ steps.range.outputs.hadith_scope }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve resumable tafsir checkpoint
        if: ${{ always() && inputs.tafsir != '' && hashFiles('.tafsir-index.checkpoint.json') != '' }}
        uses: actions/cache/save@v5.0.3
        with:
          path: .tafsir-index.checkpoint.json
          key: citation-index-${{ steps.range.outputs.tafsir_scope }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload checkpoints for inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: citation-index-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            .hadith-index.checkpoint.json
            .tafsir-index.checkpoint.json

      - name: Refresh summary
        if: ${{ always() }}
        run: |
          {
            echo "### Citation index refresh"
            echo "- Hadith range: ${{ steps.range.outputs.book }} #${{ steps.range.outputs.from }}..${{ steps.range.outputs.to }} step ${{ steps.range.outputs.step }} (${{ steps.range.outputs.lookups }} lookups)"
            echo "- Hadith checkpoint restored: ${{ steps.restore-hadith.outputs.cache-matched-key != '' }}"
            echo "- Tafsir checkpoint restored: ${{ steps.restore-tafsir.outputs.cache-matched-key != '' }}"
            echo "- Hadith build outcome: ${{ steps.build-hadith.outcome }}"
            echo "- Broad live diagnostics are intentionally separate to preserve Shamela's request budget."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate generated index (schema, canonical ids, Quran bounds, regression)
        run: npm run validate:index

      - name: Generated data diff summary
        if: ${{ always() }}
        run: |
          {
            echo "### Generated data diff";
            echo '```diff';
            git diff -- src/data/hadith-index.mjs src/data/tafsir-index.mjs || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Health gate after generated data changes
        run: npm run verify

      - name: Upload validation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v6.0.0
        with:
          name: index-validation-report-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: reports/

      - name: Open pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: bot/refresh-index
          title: "chore: refresh citation index (machine-generated, needs review)"
          commit-message: "chore: refresh citation index (machine-generated, needs review)"
          body: |
            Automated by `.github/workflows/refresh-index.yml`. Machine-generated —
            requires manual review before merge.
            - Hadith slice: `${{ steps.range.outputs.book }}` numbers `${{ steps.range.outputs.from }}..${{ steps.range.outputs.to }}` step `${{ steps.range.outputs.step }}`
            - `src/data/hadith-index.mjs` (merged, never truncated)
            - `src/data/tafsir-index.mjs` (surah ranges + ayah → page; merged)
            - `reports/index-validation.*` (schema, canonical id, Quran-bounds and
              coverage-regression validation; the workflow already fails before
              this PR is opened if validation fails or verified coverage regressed)
            Review `reports/index-validation.md` and the "unverified" counts in the
            run log before merging.
          add-paths: |
            src/data/hadith-index.mjs
            src/data/tafsir-index.mjs
            reports/
